<svg viewBox="0 0 940 480" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- FOND GENERAL -->
  <rect x="0" y="0" width="940" height="480" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- TITRE GLOBAL -->
  <text x="470" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#0b3c5d" text-anchor="middle" letter-spacing="0.5">
    SYNTHÈSE DES TOPOLOGIES ET ARCHITECTURES RÉSEAUX IOT (BANC D'ESSAI STI)
  </text>

  <!-- ========================================================================= -->
  <!-- COLONNE GAUCHE (x = 20)                                                   -->
  <!-- ========================================================================= -->

  <!-- CARTE 1 : WI-FI (STA vs SOFT-AP) -->
  <g transform="translate(20, 42)">
    <rect x="0" y="0" width="440" height="132" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="440" height="26" rx="6" fill="#e0f2fe"/>
    <text x="15" y="18" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">1. Wi-Fi : Mode Station (STA) &amp; Point d'Accès (Soft-AP)</text>

    <!-- Nœud Box/Routeur -->
    <circle cx="60" cy="62" r="18" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
    <text x="60" y="66" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Box / AP</text>
    <text x="60" y="92" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="7.5" text-anchor="middle">Réseau Local</text>

    <!-- Flèche STA -->
    <line x1="82" y1="62" x2="160" y2="62" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
    <text x="122" y="55" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">DHCP / IP</text>

    <!-- Nœud ESP32 -->
    <circle cx="185" cy="62" r="20" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <text x="185" y="60" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">ESP32</text>
    <text x="185" y="71" fill="#bae6fd" font-family="'Segoe UI', sans-serif" font-size="7" text-anchor="middle">STA + AP</text>

    <!-- Flèche Soft-AP -->
    <line x1="210" y1="62" x2="285" y2="62" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arr-orange)"/>
    <text x="248" y="55" fill="#c2410c" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">192.168.4.1</text>

    <!-- Nœud Smartphone -->
    <circle cx="310" cy="62" r="18" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="310" y="66" fill="#c2410c" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Client</text>
    <text x="310" y="92" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="7.5" text-anchor="middle">Page Web HTML</text>

    <!-- Explication basse -->
    <rect x="10" y="102" width="420" height="22" rx="3" fill="#ffffff" stroke="#bae6fd"/>
    <text x="220" y="117" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">
      <b>STA :</b> Collecte de données vers serveur &bull; <b>Soft-AP :</b> Configuration autonome sans box
    </text>
  </g>

  <!-- CARTE 2 : BLUETOOTH CLASSIC (PICONET) -->
  <g transform="translate(20, 186)">
    <rect x="0" y="0" width="440" height="132" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="0" y="0" width="440" height="26" rx="6" fill="#dbeafe"/>
    <text x="15" y="18" fill="#1d4ed8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">2. Bluetooth Classic : Piconet Maître / Esclaves (SPP)</text>

    <!-- Nœud Maître -->
    <circle cx="70" cy="62" r="20" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5"/>
    <text x="70" y="60" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Maître</text>
    <text x="70" y="71" fill="#bfdbfe" font-family="'Segoe UI', sans-serif" font-size="7" text-anchor="middle">PC / Tablette</text>

    <!-- Liaisons esclaves -->
    <line x1="93" y1="52" x2="195" y2="40" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="215" cy="40" r="14" fill="#dbeafe" stroke="#2563eb"/>
    <text x="215" y="44" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">HC-05 #1</text>

    <line x1="93" y1="62" x2="195" y2="62" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="215" cy="62" r="14" fill="#dbeafe" stroke="#2563eb"/>
    <text x="215" y="66" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">HC-05 #2</text>

    <line x1="93" y1="72" x2="195" y2="84" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="215" cy="84" r="14" fill="#dbeafe" stroke="#2563eb"/>
    <text x="215" y="88" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="7" text-anchor="middle">Escl. 3..7</text>

    <text x="325" y="60" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="bold">Profil SPP :</text>
    <text x="325" y="74" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="8">Liaison série transparente</text>
    <text x="325" y="86" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="8">Émulation port COM virtuel</text>

    <!-- Explication basse -->
    <rect x="10" y="102" width="420" height="22" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="220" y="117" fill="#1d4ed8" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">
      Liaison point-à-point fiable &bull; Débit ~1 Mbit/s &bull; Appairage par code PIN
    </text>
  </g>

  <!-- CARTE 3 : BLE (BEACONS & GATT) -->
  <g transform="translate(20, 330)">
    <rect x="0" y="0" width="440" height="132" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="0" y="0" width="440" height="26" rx="6" fill="#dcfce7"/>
    <text x="15" y="18" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">3. BLE : Balises Beacons (1-vers-N) &amp; Mode Connecté GATT</text>

    <!-- Balise Beacon -->
    <circle cx="50" cy="62" r="16" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <text x="50" y="65" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Beacon</text>
    <text x="50" y="90" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="7" text-anchor="middle">Diffusion 1&rarr;N</text>

    <path d="M 72,52 Q 86,62 72,72" stroke="#16a34a" stroke-width="1.8" fill="none"/>
    <path d="M 80,45 Q 98,62 80,79" stroke="#16a34a" stroke-width="1.8" fill="none"/>

    <!-- Séparateur vertical -->
    <line x1="150" y1="35" x2="150" y2="95" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Serveur GATT -->
    <circle cx="210" cy="62" r="18" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
    <text x="210" y="60" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Serveur</text>
    <text x="210" y="71" fill="#dcfce7" font-family="'Segoe UI', sans-serif" font-size="7" text-anchor="middle">GATT ESP32</text>

    <line x1="232" y1="62" x2="295" y2="62" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="264" y="55" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Notify / Read</text>

    <!-- Client Smartphone -->
    <circle cx="320" cy="62" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="320" y="60" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Client</text>
    <text x="320" y="71" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="6.5" text-anchor="middle">nRF Connect</text>

    <rect x="350" y="44" width="75" height="36" fill="#ffffff" rx="3" stroke="#86efac"/>
    <text x="387" y="58" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Table GATT</text>
    <text x="387" y="70" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="6.8" text-anchor="middle">Services/Char.</text>

    <!-- Explication basse -->
    <rect x="10" y="102" width="420" height="22" rx="3" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="220" y="117" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">
      <b>Beacon :</b> Télérelève sans connexion &bull; <b>GATT :</b> Commande bidirectionnelle avec smartphone
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLONNE DROITE (x = 480)                                                  -->
  <!-- ========================================================================= -->

  <!-- CARTE 4 : LORA P2P DIRECT -->
  <g transform="translate(480, 42)">
    <rect x="0" y="0" width="440" height="132" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <rect x="0" y="0" width="440" height="26" rx="6" fill="#ffedd5"/>
    <text x="15" y="18" fill="#c2410c" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">4. LoRa P2P : Liaison Directe Atelier (Point-à-Point)</text>

    <!-- Émetteur Capteur -->
    <circle cx="65" cy="62" r="20" fill="#ea580c" stroke="#9a3412" stroke-width="1.5"/>
    <text x="65" y="60" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">LoRa TX</text>
    <text x="65" y="71" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="7" text-anchor="middle">Capteur Cuve</text>

    <!-- Flèche Radio Longue Portée -->
    <line x1="90" y1="62" x2="280" y2="62" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arr-orange)"/>
    <text x="185" y="52" fill="#c2410c" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">868 MHz &bull; Portée 500 m à 5 km</text>
    <text x="185" y="75" fill="#78716c" font-family="'Segoe UI', sans-serif" font-size="7.5" text-anchor="middle">Franchit béton armé &amp; machines industrielles</text>

    <!-- Récepteur Supervision -->
    <circle cx="310" cy="62" r="20" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <text x="310" y="60" fill="#9a3412" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">LoRa RX</text>
    <text x="310" y="71" fill="#9a3412" font-family="'Segoe UI', sans-serif" font-size="7" text-anchor="middle">Supervision PC</text>

    <!-- Explication basse -->
    <rect x="10" y="102" width="420" height="22" rx="3" fill="#ffffff" stroke="#fed7aa"/>
    <text x="220" y="117" fill="#c2410c" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">
      <b>Zéro abonnement &bull; Zéro passerelle :</b> Transmission directe par commandes AT série
    </text>
  </g>

  <!-- CARTE 5 : LORAWAN ETOILE D'ETOILES -->
  <g transform="translate(480, 186)">
    <rect x="0" y="0" width="440" height="132" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
    <rect x="0" y="0" width="440" height="26" rx="6" fill="#dcfce7"/>
    <text x="15" y="18" fill="#14532d" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">5. LoRaWAN : Architecture Centralisée (Étoile d'Étoiles)</text>

    <!-- Nœuds capteurs -->
    <circle cx="45" cy="45" r="11" fill="#bbf7d0" stroke="#15803d"/>
    <circle cx="45" cy="65" r="11" fill="#bbf7d0" stroke="#15803d"/>
    <circle cx="45" cy="85" r="11" fill="#bbf7d0" stroke="#15803d"/>
    <text x="45" y="30" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Nœuds</text>

    <!-- Liaisons vers Gateway -->
    <line x1="58" y1="48" x2="140" y2="60" stroke="#15803d" stroke-width="1.2" stroke-dasharray="2,2"/>
    <line x1="58" y1="65" x2="140" y2="65" stroke="#15803d" stroke-width="1.2" stroke-dasharray="2,2"/>
    <line x1="58" y1="82" x2="140" y2="70" stroke="#15803d" stroke-width="1.2" stroke-dasharray="2,2"/>

    <!-- Gateway -->
    <circle cx="160" cy="65" r="18" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
    <text x="160" y="63" fill="#14532d" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Gateway</text>
    <text x="160" y="73" fill="#14532d" font-family="'Segoe UI', sans-serif" font-size="6.5" text-anchor="middle">Passerelle</text>

    <!-- IP Cloud -->
    <line x1="182" y1="65" x2="255" y2="65" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <text x="218" y="58" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Ethernet / 4G</text>

    <!-- Network Server -->
    <circle cx="280" cy="65" r="18" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
    <text x="280" y="63" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Serveur</text>
    <text x="280" y="73" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="6.5" text-anchor="middle">TTN Network</text>

    <!-- App Dashboard -->
    <line x1="302" y1="65" x2="350" y2="65" stroke="#475569" stroke-width="1.5"/>
    <rect x="355" y="50" width="65" height="30" fill="#ffffff" rx="3" stroke="#64748b"/>
    <text x="387" y="64" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Dashboard</text>
    <text x="387" y="74" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="6.5" text-anchor="middle">Node-RED / SQL</text>

    <!-- Explication basse -->
    <rect x="10" y="102" width="420" height="22" rx="3" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="220" y="117" fill="#14532d" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">
      Télérelève sur 15 km &bull; Passerelles transparentes &bull; Sécurité AES-128 de bout en bout
    </text>
  </g>

  <!-- CARTE 6 : RESEAUX MESH -->
  <g transform="translate(480, 330)">
    <rect x="0" y="0" width="440" height="132" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect x="0" y="0" width="440" height="26" rx="6" fill="#f3e8ff"/>
    <text x="15" y="18" fill="#6b21a8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">6. Réseaux Maillés (BLE Mesh / Thread Multi-Sauts)</text>

    <!-- Nœud Capteur Extrémité -->
    <circle cx="50" cy="62" r="15" fill="#ddd6fe" stroke="#8b5cf6"/>
    <text x="50" y="60" fill="#5b21b6" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Capteur</text>
    <text x="50" y="70" fill="#5b21b6" font-family="'Segoe UI', sans-serif" font-size="6" text-anchor="middle">Sur pile</text>

    <!-- Nœuds Relais -->
    <line x1="68" y1="55" x2="125" y2="45" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="140" cy="45" r="16" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="140" y="48" fill="#4c1d95" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Relais 1</text>

    <line x1="68" y1="68" x2="125" y2="80" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="140" cy="80" r="16" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="140" y="83" fill="#4c1d95" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Relais 2</text>

    <!-- Rebond vers Racine -->
    <line x1="158" y1="45" x2="225" y2="58" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="158" y1="80" x2="225" y2="65" stroke="#8b5cf6" stroke-width="1.5"/>

    <circle cx="245" cy="62" r="18" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
    <text x="245" y="60" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Passerelle</text>
    <text x="245" y="70" fill="#ede9fe" font-family="'Segoe UI', sans-serif" font-size="6.5" text-anchor="middle">Nœud Root</text>

    <text x="345" y="55" fill="#6b21a8" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="bold">Auto-cicatrisant :</text>
    <text x="345" y="70" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="8">Contourne les obstacles</text>
    <text x="345" y="82" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="8">métalliques par rebonds</text>

    <!-- Explication basse -->
    <rect x="10" y="102" width="420" height="22" rx="3" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="220" y="117" fill="#6b21a8" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">
      Portée étendue de proche en proche &bull; Routeurs alimentés sur secteur permanent
    </text>
  </g>
</svg>